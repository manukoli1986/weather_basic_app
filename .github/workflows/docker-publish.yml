name: Build and Publish Docker Image

# One common pipeline: build + push to Docker Hub with changing tags.
# Every push to master auto-increments the patch: v1.0.<run_number> + latest.
# Pushing a git tag v1.2.3 also publishes 1.2.3 / 1.2 / 1 (release).
on:
  workflow_dispatch:          # manual trigger from Actions tab
  push:
    branches: [ master ]
    tags: [ 'v*.*.*' ]      # e.g. v1.0.0, v1.2.3
  pull_request:
    branches: [ master ]

env:
  IMAGE_NAME: manukoli1986/weather
  VERSION_PREFIX: "1.0"       # bump when you cut a new minor line

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in only when NOT a pull_request (secrets not exposed to fork PRs).
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: manukoli1986
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag scheme:
      #   master push  -> v1.0.<run_number> , latest , sha-<short>   (auto-increment)
      #   git tag v1.2.3 -> 1.2.3 , 1.2 , 1 , latest                 (release)
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION_PREFIX }}.${{ github.run_number }},enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the version into the image so the UI can show it.
          build-args: |
            APP_VERSION=${{ env.VERSION_PREFIX }}.${{ github.run_number }}
          # Incremental builds: reuse layers from GitHub Actions cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Smoke test: run the built image with the API key from repo secret.
      # Verifies the app boots and serves the default city before we trust it.
      - name: Smoke test image
        if: github.event_name != 'pull_request'
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
        run: |
          IMG="${IMAGE_NAME}:sha-$(git rev-parse --short HEAD)"
          docker run -d --name weather-smoke \
            -e OPENWEATHER_API_KEY="$OPENWEATHER_API_KEY" \
            -e GIPHY_API_KEY="$GIPHY_API_KEY" \
            -p 8080:8080 "$IMG"
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              echo "App responded OK"
              # Read the version the running image reports (UI footer).
              HTML=$(curl -fsS http://localhost:8080/)
              RUNNING_VER=$(echo "$HTML" | grep -oE 'class="version">v[^<]*' | sed 's/.*>v//')
              echo "Image reports version: $RUNNING_VER"
              if echo "$HTML" | grep -q 'giphy.com'; then
                echo "Funny GIF: loaded (GIPHY_API_KEY active)"
              else
                echo "Funny GIF: emoji fallback (no GIPHY_API_KEY)"
              fi
              docker rm -f weather-smoke
              # Publish version to the run summary page so it's easy to see.
              {
                echo "## Published image"
                echo ""
                echo "| Field | Value |"
                echo "|-------|-------|"
                echo "| Version | \`${VERSION_PREFIX}.${GITHUB_RUN_NUMBER}\` |"
                echo "| Running UI reports | \`v${RUNNING_VER}\` |"
                echo "| Tags | \`${VERSION_PREFIX}.${GITHUB_RUN_NUMBER}\`, \`latest\`, \`sha-$(git rev-parse --short HEAD)\` |"
                echo "| Image | \`${IMAGE_NAME}\` |"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo "App did not respond"; docker logs weather-smoke; docker rm -f weather-smoke; exit 1

      # Closes the loop with terraform-AI: opens a PR bumping project_weather-app's
      # app.tfvars to the image just published, instead of someone editing it by
      # hand. terraform-AI's project-infra.yml plans on that PR and applies on
      # merge — this step only opens the PR, it never merges/applies itself.
      # Needs TERRAFORM_AI_PAT: a token scoped to mk-ai-projects/terraform-AI
      # with Contents (write) + Pull requests (write) permissions.
      - name: Open PR to bump terraform-AI image tag
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.TERRAFORM_AI_PAT }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/mk-ai-projects/terraform-AI.git" /tmp/terraform-AI
          cd /tmp/terraform-AI
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="bump-weather-app-${VERSION}"
          git checkout -b "$BRANCH"

          sed -i "s|^image *= .*|image                 = \"docker.io/manukoli1986/weather:${VERSION}\"|" project_weather-app/app.tfvars

          if git diff --quiet project_weather-app/app.tfvars; then
            echo "app.tfvars already at ${VERSION} — nothing to open a PR for."
            exit 0
          fi

          git add project_weather-app/app.tfvars
          git commit -m "bump weather-app image to ${VERSION}"
          git push origin "$BRANCH"

          gh pr create --repo mk-ai-projects/terraform-AI \
            --title "bump weather-app image to ${VERSION}" \
            --body "Auto-opened after weather_basic_app CI published docker.io/manukoli1986/weather:${VERSION}." \
            --base main --head "$BRANCH"
