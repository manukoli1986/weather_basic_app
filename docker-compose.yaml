version: "3.8"
services:
    web:
      image: weather
      build: .
      environment:
        # Pass the key from your shell/env: export OPENWEATHER_API_KEY=xxx
        - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      deploy:
        replicas: 2
        restart_policy:
          condition: on-failure
      ports:
        - "8080:8080"
