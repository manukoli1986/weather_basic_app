version: "3.8"
services:
  web:
    image: manukoli1986/weather:latest
    build:
      context: .
      args:
        APP_VERSION: local
    env_file:
      - .env
    environment:
      # Shell export wins over env_file when both are set.
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
    ports:
      - "8080:8080"
    restart: unless-stopped
