<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather App</title>
<link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="16x16">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root { --accent: #ffffff; }

  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
    transition: background 0.6s ease;
    /* Default background, overridden per weather condition below. */
    background: linear-gradient(135deg, #2c3e50, #4ca1af);
  }

  /* Weather-driven backgrounds. body class set from weather.main / night. */
  body.clear   { background: linear-gradient(135deg, #2980b9, #6dd5fa, #ffffff); }
  body.clouds  { background: linear-gradient(135deg, #757f9a, #d7dde8); }
  body.rain,
  body.drizzle { background: linear-gradient(135deg, #373b44, #4286f4); }
  body.thunderstorm { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); }
  body.snow    { background: linear-gradient(135deg, #83a4d4, #b6fbff); color: #223; }
  body.mist,
  body.haze,
  body.fog     { background: linear-gradient(135deg, #606c88, #3f4c6b); }
  body.night   { background: linear-gradient(135deg, #0f2027, #2c5364); }

  .card {
    width: 100%;
    max-width: 420px;
    padding: 32px;
    border-radius: 24px;
    text-align: center;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
  }

  h1 { font-size: 22px; font-weight: 600; margin-bottom: 20px; letter-spacing: 0.5px; }

  form { display: flex; gap: 8px; margin-bottom: 24px; }

  input[type=text] {
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    background: rgba(255, 255, 255, 0.85);
    color: #222;
  }

  input[type=submit] {
    padding: 12px 18px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.9);
    color: #2c3e50;
    transition: transform 0.15s ease;
  }
  input[type=submit]:hover { transform: scale(1.05); }

  .city { font-size: 26px; font-weight: 600; }
  .temp { font-size: 64px; font-weight: 200; margin: 8px 0; }
  .desc { font-size: 17px; text-transform: capitalize; opacity: 0.9; }
  .icon img { width: 120px; height: 120px; }

  .error h2 { font-size: 40px; margin-bottom: 10px; }
  .error p { opacity: 0.9; }

  .version { margin-top: 20px; font-size: 12px; opacity: 0.7; letter-spacing: 0.5px; }
</style>
</head>
<body class="{% if weather %}{{ weather.main|lower }}{% if not weather.is_day %} night{% endif %}{% endif %}">
  <div class="card">
    <h1>🌤️ Weather App</h1>

    <form method="POST">
      <input type="text" id="city" name="city" placeholder="Enter a city…" autofocus>
      <input type="submit" value="Search">
    </form>

    {% if weather_error %}
    <div class="error">
      <h2>😕 Oops!</h2>
      <p><strong>{{ weather_error.city }}</strong> not found.</p>
      <p>{{ weather_error.country }}</p>
    </div>
    {% elif weather %}
    <div class="icon">
      <img src="https://openweathermap.org/img/wn/{{ weather.icon }}@2x.png" alt="{{ weather.description }}">
    </div>
    <div class="city">{{ weather.city }}</div>
    <div class="temp">{{ weather.temperature }}°C</div>
    <div class="desc">{{ weather.description }}</div>
    {% endif %}

    <div class="version">v{{ app_version }}</div>
  </div>
</body>
</html>
